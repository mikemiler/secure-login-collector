name: Deploy to Freemius

on:
  push:
    tags:
      - 'v*.*.*'  # Triggers on version tags like v1.0.0

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: get_version
        run: |
          # Remove 'v' prefix from tag (v1.0.0 -> 1.0.0)
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Deploying version: $VERSION"

      - name: Create deployment package
        run: |
          # Create temporary build directory outside plugin structure
          BUILD_DIR="/tmp/plugin-build-${{ steps.get_version.outputs.version }}"
          mkdir -p "$BUILD_DIR/secure-login-collector"

          # Copy plugin files (exclude dev files only - Freemius handles premium/free separation)
          rsync -av \
            --exclude='.git*' \
            --exclude='node_modules' \
            --exclude='tests' \
            --exclude='.swarm' \
            --exclude='*.log' \
            --exclude='.DS_Store' \
            --exclude='phpunit.xml' \
            --exclude='composer.json' \
            --exclude='composer.lock' \
            --exclude='package.json' \
            --exclude='package-lock.json' \
            --exclude='.github' \
            --exclude='deploy' \
            --exclude='docs' \
            ./ "$BUILD_DIR/secure-login-collector/"

          # Create ZIP file in workflow root (not in plugin structure)
          cd "$BUILD_DIR"
          zip -r "$GITHUB_WORKSPACE/secure-login-collector-${{ steps.get_version.outputs.version }}.zip" secure-login-collector/
          cd "$GITHUB_WORKSPACE"

          # Clean up temporary build directory
          rm -rf "$BUILD_DIR"

          # Verify ZIP was created
          ls -lh secure-login-collector-${{ steps.get_version.outputs.version }}.zip

      - name: Deploy to Freemius
        uses: buttonizer/freemius-deploy@v0.1.3
        with:
          file_name: secure-login-collector-${{ steps.get_version.outputs.version }}.zip
          version: ${{ steps.get_version.outputs.version }}
          release_mode: pending
          sandbox: false
        env:
          PUBLIC_KEY: ${{ secrets.FREEMIUS_PUBLIC_KEY }}
          SECRET_KEY: ${{ secrets.FREEMIUS_SECRET_KEY }}
          DEV_ID: 24748
          PLUGIN_ID: 19897
          PLUGIN_SLUG: secure-login-collector

      - name: Notify deployment success
        run: |
          echo "✅ Successfully deployed version ${{ steps.get_version.outputs.version }} to Freemius"
          echo "📦 Release package: secure-login-collector-${{ steps.get_version.outputs.version }}.zip"
