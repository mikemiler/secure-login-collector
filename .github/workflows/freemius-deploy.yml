name: Deploy to Freemius

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to deploy (optional, auto-detected if not provided)'
        required: false
        type: string

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create deployment package
        id: package
        run: |
          # Make script executable
          chmod +x ./create-deployment-package.sh

          # Run deployment script (auto-detects version, uses GitHub Actions mode)
          ./create-deployment-package.sh

          # Get the created package info from GitHub output
          echo "Package created successfully"

      - name: Upload deployment artifacts
        uses: actions/upload-artifact@v4
        with:
          name: deployment-packages
          path: deploy/*.zip
          retention-days: 30

      - name: Upload checksums
        uses: actions/upload-artifact@v4
        with:
          name: checksums
          path: deploy/*.sha256
          retention-days: 30

      - name: Deploy to Freemius
        env:
          FREEMIUS_DEVELOPER_ID: ${{ secrets.FREEMIUS_DEVELOPER_ID }}
          FREEMIUS_PLUGIN_ID: ${{ secrets.FREEMIUS_PLUGIN_ID }}
          FREEMIUS_PUBLIC_KEY: ${{ secrets.FREEMIUS_PUBLIC_KEY }}
          FREEMIUS_SECRET_KEY: ${{ secrets.FREEMIUS_SECRET_KEY }}
        run: |
          echo "🚀 Deploying to Freemius..."

          # Find the dev package
          DEV_PACKAGE=$(ls deploy/secure-login-collector-dev-*.zip | head -1)

          if [ -z "$DEV_PACKAGE" ]; then
            echo "❌ Error: No deployment package found"
            exit 1
          fi

          echo "📦 Package: $DEV_PACKAGE"

          # Deploy using Freemius API
          curl -X POST "https://api.freemius.com/v1/developers/${FREEMIUS_DEVELOPER_ID}/plugins/${FREEMIUS_PLUGIN_ID}/tags.json" \
            -F "public_key=${FREEMIUS_PUBLIC_KEY}" \
            -F "secret_key=${FREEMIUS_SECRET_KEY}" \
            -F "file=@${DEV_PACKAGE}"

          echo "✅ Deployment complete"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            deploy/*.zip
            deploy/*.sha256
          draft: false
          prerelease: false
