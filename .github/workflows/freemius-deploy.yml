name: Deploy to Freemius

on:
  push:
    tags:
      - 'v*.*.*'  # Triggers on version tags like v1.0.0

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.0'
          coverage: none

      - name: Extract version from tag
        id: get_version
        run: |
          # Remove 'v' prefix from tag (v1.0.0 -> 1.0.0)
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Deploying version: $VERSION"

      - name: Create deployment package
        run: |
          # Create a clean directory for the plugin
          mkdir -p deploy/secure-login-collector

          # Copy plugin files (exclude dev files)
          rsync -av \
            --exclude='.git*' \
            --exclude='node_modules' \
            --exclude='tests' \
            --exclude='.swarm' \
            --exclude='*.log' \
            --exclude='.DS_Store' \
            --exclude='phpunit.xml' \
            --exclude='composer.json' \
            --exclude='composer.lock' \
            --exclude='package.json' \
            --exclude='package-lock.json' \
            --exclude='.github' \
            ./ deploy/secure-login-collector/

          # Create ZIP file
          cd deploy
          zip -r ../secure-login-collector-${{ steps.get_version.outputs.version }}.zip secure-login-collector/
          cd ..

          # Verify ZIP was created
          ls -lh secure-login-collector-${{ steps.get_version.outputs.version }}.zip

      - name: Deploy to Freemius (direct API, Bearer)
        run: |
          API_HOST="https://api.freemius.com"

          curl -f -X POST "$API_HOST/v1/products/${PLUGIN_ID}.json" \
            -H "Authorization: Bearer ${FREEMIUS_API_TOKEN}" \
            -F "file=@secure-login-collector-${{ steps.get_version.outputs.version }}.zip" \
            -F "version=${{ steps.get_version.outputs.version }}" \
            -F "is_released=false" \
            -F "add_contributor=false"
        env:
          PLUGIN_ID: 19897
          FREEMIUS_API_TOKEN: ${{ secrets.FREEMIUS_API_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: secure-login-collector-${{ steps.get_version.outputs.version }}.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify deployment success
        run: |
          echo "✅ Successfully deployed version ${{ steps.get_version.outputs.version }} to Freemius"
          echo "📦 Release package: secure-login-collector-${{ steps.get_version.outputs.version }}.zip"
