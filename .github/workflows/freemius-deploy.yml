name: Freemius Deploy

on:
  push:
    tags:
      - 'v*'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Create deployment package
        run: |
          mkdir -p deploy
          rsync -av \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='tests' \
            --exclude='docs' \
            --exclude='.gitignore' \
            --exclude='.gitattributes' \
            --exclude='phpunit.xml' \
            --exclude='composer.json' \
            --exclude='composer.lock' \
            --exclude='package.json' \
            --exclude='package-lock.json' \
            --exclude='*.md' \
            ./ deploy/secure-login-collector/
          cd deploy
          zip -r secure-login-collector-${{ steps.version.outputs.VERSION }}.zip secure-login-collector/

      - name: Deploy to Freemius
        uses: buttonizer/freemius-deploy@v0.1.2
        env:
          PUBLIC_KEY: ${{ secrets.FREEMIUS_PUBLIC_KEY }}
          SECRET_KEY: ${{ secrets.FREEMIUS_SECRET_KEY }}
          DEV_ID: ${{ secrets.FREEMIUS_DEVELOPER_ID }}
          PLUGIN_ID: ${{ secrets.FREEMIUS_PLUGIN_ID }}
          PLUGIN_SLUG: secure-login-collector
        with:
          file_name: deploy/secure-login-collector-${{ steps.version.outputs.VERSION }}.zip
          version: ${{ steps.version.outputs.VERSION }}
          release_mode: released
          sandbox: false
